<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POST Test</title>
</head>
<body>

  <button onclick="testPost()">測試發送 POST</button>

  <script>
    function testPost() {
      const SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbwhPd5rAqrLMYSXJ7jnsKKSQtC5Ja2yQMIIttvaBt6wo0DKeU0ark2AUUC-rtEe8-Wq/exec";

      fetch(SCRIPT_URL, {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify({
          testMessage: "Hello from GitHub Pages!"
        })
      })
      .then(response => {
        console.log("POST 已送出，Response 狀態：", response.status);
      })
      .catch(error => {
        console.log("前端可能出現 CORS 錯誤，先不用管：", error);
      });
    }
  </script>

</body>
</html>
